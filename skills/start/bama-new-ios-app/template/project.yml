# XcodeGen spec. `make generate` (and every build) turns it into
# __APP_NAME__.xcodeproj, which stays out of git. Edit this file, never the
# .xcodeproj.
name: __APP_NAME__
options:
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
packages:
  # Rules and data logic with no SwiftUI, so tests run on the Mac without a simulator.
  __APP_NAME__Kit:
    path: Kit
targets:
  __APP_NAME__:
    type: application
    platform: iOS
    sources:
      - path: Sources/__APP_NAME__
      - path: Icon/AppIcon.icon
    dependencies:
      - package: __APP_NAME__Kit
    scheme: {}
    settings:
      base:
        # Never change it once the app is on a phone: a new id is a new app,
        # and the old one's data stays behind.
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "6.0"
        # App code runs on the main thread unless you say otherwise.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: __APP_NAME__
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: >-
          UIInterfaceOrientationPortrait
          UIInterfaceOrientationLandscapeLeft
          UIInterfaceOrientationLandscapeRight
